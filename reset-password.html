<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — UIVault by Kuvwy</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 24px;
    }

    .reset-box {
      background: #fff;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .reset-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1rem;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .reset-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .reset-subtitle {
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    .reset-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
      display: block;
    }

    .reset-input-wrap {
      position: relative;
      width: 100%;
    }

    .reset-input {
      width: 100%;
      padding: 12px 44px 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      color: var(--text-primary);
      outline: none;
      background: var(--bg-secondary);
      transition: border-color 0.2s;
      box-sizing: border-box;
    }

    .reset-input:focus {
      border-color: var(--kuvwy-orange);
    }

    .eye-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #b0b3b8;
      padding: 4px;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }

    .eye-btn:hover {
      color: #050505;
    }

    .reset-submit {
      width: 100%;
      padding: 14px;
      background: var(--kuvwy-gradient);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .reset-submit:hover { opacity: 0.9; }
    .reset-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .reset-error {
      font-size: 0.82rem;
      color: #ef4444;
      background: rgba(239,68,68,0.07);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      display: none;
    }

    .reset-success {
      font-size: 0.85rem;
      color: #22c55e;
      background: rgba(34,197,94,0.08);
      border: 1px solid rgba(34,197,94,0.2);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-weight: 500;
      display: none;
    }

    .reset-back {
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .reset-back a {
      color: var(--kuvwy-orange);
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="reset-box">
    <div class="reset-logo">
      <span class="logo-dot"></span>
      UIVault by Kuvwy
    </div>
    <h1 class="reset-title">Create New Password</h1>
    <p class="reset-subtitle">Choose a strong password for your account.</p>

    <div id="resetForm">
      <label class="reset-label" for="newPassword">New Password</label>
      <div class="reset-input-wrap">
        <input type="password" id="newPassword" class="reset-input" placeholder="Min. 6 characters" />
        <button type="button" class="eye-btn" id="toggleNewPassword" aria-label="Show password">
          <svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
          <svg class="eye-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

      <label class="reset-label" for="confirmPassword" style="margin-top:12px;">Confirm Password</label>
      <div class="reset-input-wrap">
        <input type="password" id="confirmPassword" class="reset-input" placeholder="Repeat your password" />
        <button type="button" class="eye-btn" id="toggleConfirmPassword" aria-label="Show password">
          <svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
          <svg class="eye-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

      <p class="reset-error" id="resetError"></p>

      <button class="reset-submit" id="resetSubmit" style="margin-top:16px;">Update Password</button>
    </div>

    <div class="reset-success" id="resetSuccess">
      Password updated! Redirecting you to the site...
    </div>

    <p class="reset-back"><a href="index.html">Back to UIVault</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function() {
      const SUPABASE_URL = 'https://umfwvksnaqgtjvkgpgow.supabase.co';
      const SUPABASE_ANON_KEY = 'sb_publishable_W9XISd-bgINvMvzqe6Xe3g_vBxyTa8p';
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const resetSubmit = document.getElementById('resetSubmit');
      const resetError = document.getElementById('resetError');
      const resetSuccess = document.getElementById('resetSuccess');
      const resetForm = document.getElementById('resetForm');
      const newPasswordInput = document.getElementById('newPassword');
      const confirmPasswordInput = document.getElementById('confirmPassword');

      let sessionReady = false;

      // ===== EYE TOGGLES =====
      function togglePasswordVisibility(inputId, toggleBtnId) {
        const input = document.getElementById(inputId);
        const btn = document.getElementById(toggleBtnId);
        if (!btn) return;
        const eyeOff = btn.querySelector('.eye-off');
        const eyeOn = btn.querySelector('.eye-on');

        btn.addEventListener('click', function() {
          if (input.type === 'password') {
            input.type = 'text';
            eyeOff.style.display = 'none';
            eyeOn.style.display = 'block';
          } else {
            input.type = 'password';
            eyeOff.style.display = 'block';
            eyeOn.style.display = 'none';
          }
        });
      }

      togglePasswordVisibility('newPassword', 'toggleNewPassword');
      togglePasswordVisibility('confirmPassword', 'toggleConfirmPassword');

      // ===== EXTRACT TOKENS FROM URL HASH =====
      function getTokensFromURL() {
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        return {
          access_token: params.get('access_token'),
          refresh_token: params.get('refresh_token')
        };
      }

      // ===== CHECK SESSION =====
      async function checkAndSetSession() {
        const { access_token, refresh_token } = getTokensFromURL();

        if (access_token && refresh_token) {
          try {
            const { data, error } = await supabase.auth.setSession({
              access_token: access_token,
              refresh_token: refresh_token,
            });

            if (error) throw error;

            sessionReady = true;
            resetSubmit.disabled = false;
            resetError.style.display = 'none';
            return;
          } catch (err) {
            resetError.textContent = 'Invalid or expired reset link. Please request a new one.';
            resetError.style.display = 'block';
            resetSubmit.disabled = true;
            return;
          }
        }

        try {
          const { data: { session } } = await supabase.auth.getSession();
          if (session) {
            sessionReady = true;
            resetSubmit.disabled = false;
            resetError.style.display = 'none';
            return;
          }
        } catch (err) {}

        resetError.textContent = 'No reset link found. Please request a new password reset.';
        resetError.style.display = 'block';
        resetSubmit.disabled = true;
      }

      checkAndSetSession();

      // ===== CONFIRM PASSWORD MATCH =====
      confirmPasswordInput.addEventListener('input', function() {
        if (this.value && newPasswordInput.value !== this.value) {
          resetError.textContent = 'Passwords do not match.';
          resetError.style.display = 'block';
        } else {
          resetError.style.display = 'none';
        }
      });

      // ===== UPDATE PASSWORD =====
      resetSubmit.addEventListener('click', async function() {
        if (this.disabled) return;

        if (!sessionReady) {
          resetError.textContent = 'Session expired. Please request a new reset link.';
          resetError.style.display = 'block';
          return;
        }

        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        resetError.style.display = 'none';
        resetError.textContent = '';

        if (!newPassword || newPassword.length < 6) {
          resetError.textContent = 'Password must be at least 6 characters.';
          resetError.style.display = 'block';
          return;
        }

        if (newPassword !== confirmPassword) {
          resetError.textContent = 'Passwords do not match.';
          resetError.style.display = 'block';
          return;
        }

        this.disabled = true;
        this.textContent = 'Updating...';

        try {
          const { error } = await supabase.auth.updateUser({ password: newPassword });
          if (error) throw error;

          resetForm.style.display = 'none';
          resetSuccess.style.display = 'block';

          setTimeout(() => {
            window.location.href = 'https://kuvwy.github.io/kuvwy-uivault/';
          }, 3000);

        } catch (err) {
          resetError.textContent = err.message || 'Something went wrong. Please try again.';
          resetError.style.display = 'block';
          this.disabled = false;
          this.textContent = 'Update Password';
        }
      });

    })();
  </script>
</body>
</html>
