<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — UIVault by Kuvwy</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 24px;
    }
    .reset-box {
      background: #fff;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 40px 32px;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .reset-logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1rem; }
    .reset-title { font-size: 1.3rem; font-weight: 700; }
    .reset-subtitle { font-size: 0.875rem; color: var(--text-secondary); }
    .reset-label { font-size: 0.8rem; font-weight: 600; display: block; margin-bottom: 4px; }
    .reset-input-wrap { position: relative; width: 100%; }
    .reset-input {
      width: 100%;
      padding: 12px 44px 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      background: var(--bg-secondary);
      outline: none;
    }
    .reset-input:focus { border-color: var(--kuvwy-orange); }
    .eye-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #b0b3b8;
    }
    .reset-submit {
      width: 100%;
      padding: 14px;
      background: var(--kuvwy-gradient);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      font-weight: 600;
      cursor: pointer;
    }
    .reset-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .reset-error { font-size: 0.82rem; color: #ef4444; background: rgba(239,68,68,0.07); padding: 8px 12px; border-radius: var(--radius-sm); display: none; }
    .reset-success { font-size: 0.85rem; color: #22c55e; background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.2); padding: 12px 14px; border-radius: var(--radius-md); display: none; font-weight: 500; }
    .reset-debug {
      font-size: 0.7rem;
      color: var(--text-muted);
      background: #f4f4f5;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      font-family: monospace;
      word-break: break-all;
      display: block;
      min-height: 40px;
    }
    .reset-debug.error { color: #ef4444; border-color: #ef4444; background: #fef2f2; }
    .reset-debug.success { color: #22c55e; border-color: #22c55e; background: #f0fdf4; }
    .reset-back { text-align: center; font-size: 0.82rem; color: var(--text-muted); }
    .reset-back a { color: var(--kuvwy-orange); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="reset-box">
    <div class="reset-logo"><span class="logo-dot"></span>UIVault by Kuvwy</div>
    <h1 class="reset-title">Create New Password</h1>
    <p class="reset-subtitle">Choose a strong password for your account.</p>

    <!-- DEBUG PANEL -->
    <div id="debugStatus" class="reset-debug">Initializing...</div>

    <div id="resetForm">
      <label class="reset-label" for="newPassword">New Password</label>
      <div class="reset-input-wrap">
        <input type="password" id="newPassword" class="reset-input" placeholder="Min. 6 characters" />
        <button type="button" class="eye-btn" id="toggleNewPassword">👁</button>
      </div>

      <label class="reset-label" for="confirmPassword" style="margin-top:12px;">Confirm Password</label>
      <div class="reset-input-wrap">
        <input type="password" id="confirmPassword" class="reset-input" placeholder="Repeat your password" />
        <button type="button" class="eye-btn" id="toggleConfirmPassword">👁</button>
      </div>

      <p class="reset-error" id="resetError"></p>

      <button class="reset-submit" id="resetSubmit" style="margin-top:16px;">Update Password</button>
    </div>

    <div class="reset-success" id="resetSuccess">Password updated! Redirecting...</div>

    <p class="reset-back"><a href="index.html">Back to UIVault</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function() {
      const SUPABASE_URL = 'https://umfwvksnaqgtjvkgpgow.supabase.co';
      const SUPABASE_ANON_KEY = 'sb_publishable_W9XISd-bgINvMvzqe6Xe3g_vBxyTa8p';
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const debugEl = document.getElementById('debugStatus');
      function setDebug(msg, type) {
        debugEl.textContent = msg;
        debugEl.className = 'reset-debug' + (type ? ' ' + type : '');
        console.log(msg);
      }

      const resetSubmit = document.getElementById('resetSubmit');
      const resetError = document.getElementById('resetError');
      const resetSuccess = document.getElementById('resetSuccess');
      const resetForm = document.getElementById('resetForm');
      const newPasswordInput = document.getElementById('newPassword');
      const confirmPasswordInput = document.getElementById('confirmPassword');

      let sessionReady = false;

      // ---- EYE TOGGLES ----
      function togglePasswordVisibility(inputId, toggleBtnId) {
        const input = document.getElementById(inputId);
        const btn = document.getElementById(toggleBtnId);
        if (!btn) return;
        btn.addEventListener('click', function() {
          if (input.type === 'password') {
            input.type = 'text';
            btn.textContent = '🙈';
          } else {
            input.type = 'password';
            btn.textContent = '👁';
          }
        });
      }
      togglePasswordVisibility('newPassword', 'toggleNewPassword');
      togglePasswordVisibility('confirmPassword', 'toggleConfirmPassword');

      // ---- SHOW URL HASH ----
      setDebug('Current URL: ' + window.location.href, '');
      const hash = window.location.hash.substring(1);
      setDebug('Hash after #: ' + (hash || '(empty)'), '');

      // ---- EXTRACT TOKENS ----
      function getTokensFromURL() {
        const params = new URLSearchParams(hash);
        return {
          access_token: params.get('access_token'),
          refresh_token: params.get('refresh_token')
        };
      }

      async function checkAndSetSession() {
        const { access_token, refresh_token } = getTokensFromURL();
        setDebug('Access token: ' + (access_token ? '✅ present' : '❌ missing'), '');
        setDebug('Refresh token: ' + (refresh_token ? '✅ present' : '❌ missing'), '');

        if (access_token && refresh_token) {
          try {
            setDebug('Attempting manual setSession...', '');
            const { data, error } = await supabase.auth.setSession({
              access_token: access_token,
              refresh_token: refresh_token,
            });
            if (error) throw error;
            sessionReady = true;
            resetSubmit.disabled = false;
            resetError.style.display = 'none';
            setDebug('✅ Session set! Ready to update.', 'success');
            return;
          } catch (err) {
            setDebug('❌ setSession error: ' + err.message, 'error');
          }
        }

        // Fallback: try getSession
        try {
          const { data: { session } } = await supabase.auth.getSession();
          if (session) {
            sessionReady = true;
            resetSubmit.disabled = false;
            resetError.style.display = 'none';
            setDebug('✅ Session found via fallback.', 'success');
            return;
          }
        } catch (err) {
          setDebug('❌ getSession error: ' + err.message, 'error');
        }

        resetError.textContent = 'No valid reset link found. Please request a new one.';
        resetError.style.display = 'block';
        resetSubmit.disabled = true;
        setDebug('❌ No session. Check link or redirect URL.', 'error');
      }

      checkAndSetSession();

      confirmPasswordInput.addEventListener('input', function() {
        if (this.value && newPasswordInput.value !== this.value) {
          resetError.textContent = 'Passwords do not match.';
          resetError.style.display = 'block';
        } else {
          resetError.style.display = 'none';
        }
      });

      resetSubmit.addEventListener('click', async function() {
        if (this.disabled) return;
        if (!sessionReady) {
          resetError.textContent = 'Session expired. Request a new reset link.';
          resetError.style.display = 'block';
          return;
        }

        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;
        resetError.style.display = 'none';

        if (!newPassword || newPassword.length < 6) {
          resetError.textContent = 'Password must be at least 6 characters.';
          resetError.style.display = 'block';
          return;
        }
        if (newPassword !== confirmPassword) {
          resetError.textContent = 'Passwords do not match.';
          resetError.style.display = 'block';
          return;
        }

        this.disabled = true;
        this.textContent = 'Updating...';

        try {
          const { error } = await supabase.auth.updateUser({ password: newPassword });
          if (error) throw error;

          resetForm.style.display = 'none';
          resetSuccess.style.display = 'block';
          setDebug('✅ Password updated successfully!', 'success');

          setTimeout(() => {
            window.location.href = 'https://kuvwy.github.io/kuvwy-uivault/';
          }, 3000);
        } catch (err) {
          setDebug('❌ Update error: ' + err.message, 'error');
          resetError.textContent = err.message || 'Something went wrong.';
          resetError.style.display = 'block';
          this.disabled = false;
          this.textContent = 'Update Password';
        }
      });
    })();
  </script>
</body>
</html>
